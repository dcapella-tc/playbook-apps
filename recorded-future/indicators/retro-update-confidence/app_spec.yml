allowOnDemand: true
appId: 6e0cebfa-24df-4a00-b75f-2395ce08500c
category: Utility
displayName: RF Retro Update Confidence
features:
- aotExecutionEnabled
- appBuilderCompliant
- fileParams
- redisPasswordSupport
- runtimeVariables
languageVersion: '3.11'
listDelimiter: '|'
minServerVersion: 7.2.0
note: Retrieve indicators matching a TQL query and set each indicator's confidence
  to the integer value of its Risk List attribute.
outputData:
- display: '1'
  outputVariables:
  - name: indicators.updated
  - name: indicators.skipped
  - name: indicators.failed
packageName: TCPB_-_RF_Retro_Update_Confidence
playbook: {}
programLanguage: PYTHON
programMain: run.py
programVersion: 1.0.0
releaseNotes:
- notes:
  - Initial release. Paginate TQL indicators and update confidence from Risk List.
  version: 1.0.0
runtimeLevel: Playbook
schemaVersion: 1.1.0
sdkVersion: 4.0.1
sections:
- params:
  - label: TQL
    name: tql
    note: ThreatConnect Query Language used to select indicators. Include ownerName
      in the TQL when the job should be owner-scoped.
    playbookDataType:
    - String
    required: true
    validValues:
    - ${TEXT}
    viewRows: 4
  sectionName: Inputs
