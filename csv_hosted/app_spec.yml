allowOnDemand: true
appId: 230b94ee-2144-588c-94b7-711724ab1d75
category: Utility
displayName: CSV Fileshare
features:
- aotExecutionEnabled
- appBuilderCompliant
- fileParams
- redisPasswordSupport
- runtimeVariables
languageVersion: '3.11'
listDelimiter: '|'
minServerVersion: 7.2.0
note: Accepts CSV text and writes data.csv to ThreatConnect fileshare output (publishOutFiles)
  for HTTP access.
outputData:
- display: '1'
  outputVariables:
  - name: csv.filename
packageName: TCPB_-_CSV_Fileshare
playbook: {}
programLanguage: PYTHON
programMain: run.py
programVersion: 1.1.0
publishOutFiles:
- data.csv
releaseNotes:
- notes:
  - Accepts CSV string; publishes data.csv via fileshare; playbook output csv.filename.
  version: 1.1.0
- notes:
  - Initial Release
  version: 1.0.0
runtimeLevel: Playbook
schemaVersion: 1.1.0
sdkVersion: 4.0.0
sections:
- params:
  - label: CSV Data
    name: csv_data
    note: Raw CSV body to publish as data.csv on fileshare.
    playbookDataType:
    - String
    required: true
    validValues:
    - ${TEXT}
    viewRows: 6
  sectionName: Inputs
