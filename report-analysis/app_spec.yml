allowOnDemand: true
appId: 6e26ba55-0300-5462-aca7-ea049494c8a5
category: Utility
displayName: Report Analysis
features:
- aotExecutionEnabled
- appBuilderCompliant
- fileParams
- redisPasswordSupport
- runtimeVariables
languageVersion: '3.11'
listDelimiter: '|'
minServerVersion: 7.2.0
note: Parse report content via JMESPath and Doc Analysis, then create or update a
  ThreatConnect Report and associated indicators.
outputData: []
packageName: TCPB_-_Report_Analysis
playbook: {}
programLanguage: PYTHON
programMain: run.py
programVersion: 1.0.0
releaseNotes:
- notes:
  - Initial skeleton release.
  version: 1.0.0
runtimeLevel: Playbook
schemaVersion: 1.1.0
sdkVersion: 4.0.1
sections:
- params:
  - label: Owner Name
    name: owner_name
    note: ThreatConnect owner for the report and indicators.
    playbookDataType:
    - String
    required: true
    validValues:
    - ${TEXT}
    viewRows: 1
  - label: Report Name
    name: report_name
    note: Name of the ThreatConnect Report group to create or update.
    playbookDataType:
    - String
    required: true
    validValues:
    - ${TEXT}
    viewRows: 1
  - label: content
    name: content
    note: Raw report content (typically JSON) to preprocess and analyze.
    playbookDataType:
    - String
    required: true
    validValues:
    - ${TEXT}
    viewRows: 6
  sectionName: Inputs
